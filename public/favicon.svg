<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF003C" />
      <stop offset="50%" stop-color="#D90429" />
      <stop offset="100%" stop-color="#050103" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FF758F" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Glow Ring -->
  <circle cx="256" cy="256" r="236" fill="#050103" stroke="url(#bgGrad)" stroke-width="18" filter="url(#glow)" />
  <circle cx="256" cy="256" r="210" fill="#0A0205" stroke="rgba(255,0,60,0.3)" stroke-width="6" />

  <!-- Monogram AKS Text -->
  <text x="256" y="300" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="190" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-4">AKS</text>
  
  <!-- Neon Red Accent Dot -->
  <circle cx="410" cy="160" r="24" fill="#FF003C" />
</svg>
